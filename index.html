  <div class="wrap" id="wrap">
    <section class="cat" id="cat-0"><header class="cat-head"><span class="cat-name">世界观·时代</span><span class="cat-num">8</span></header><div class="cards"><figure class="card"><blockquote>美国不是一个国家，他是一个伪装成国家的公司，股东们以钱为目的，吸血全世界供养自己。基建这东西在美国不可能，美国只要供养得起富人，谁管穷人会怎么样呢？他们不会把钱投在没有效益的地方，做利人损己的事。美国实际掌权者是资本家和他们的后代，普通人都被快乐教育了，只能成为工具人。他们的口号听听就好了，实际上就是一群强盗杀人越货后吃老本，还想故技重施再干一票继续吃。</blockquote><div class="src">— 个人思考 · 关于美国与资本</div></figure><figure class="card"><blockquote>所谓意识形态就是文明的解释权，西方觉得三权分立才能保障民权，我们觉得共产才能保障民权，经济基础决定上层建筑。西方世界实际上已经陷入无限党争，国家成了各路资本家的战场，谁都不敢对国家的长远未来负责。相信时间站在我们这边，只是西方从近代以来就从世界掠夺了大量资源，他只能暂时领先。</blockquote><div class="src">— 个人思考 · 关于意识形态</div></figure><figure class="card"><blockquote>中国常常因为过于正常而与世界格格不入。</blockquote><div class="src">— 个人思考</div></figure><figure class="card"><blockquote>太难了，资本就是逐利，环境什么的对他们来说不重要，除非耽误他们逐利了。</blockquote><div class="src">— 个人思考</div></figure><figure class="card"><blockquote>一个国家真正的强大，不在于它可以毁灭多少东西，而在于它能够守护多少东西。</blockquote></figure><figure class="card"><blockquote>潮水退去之后，才知道谁在裸泳；浪潮兴起之时，才知道谁在造船。</blockquote></figure><figure class="card"><blockquote>时代从不说话，却回答了所有问题；岁月从不言语，却见证所有人心。</blockquote></figure><figure class="card"><blockquote>历史不会重复，但总是押着相同的韵脚。</blockquote></figure></div></section><section class="cat" id="cat-1"><header class="cat-head"><span class="cat-name">民族工业·自主创新</span><span class="cat-num">5</span></header><div class="cards"><figure class="card"><blockquote>比亚迪不就是个例子，被喷汽配城水平，王传福从首富位置下来，把所有的资金和精力用在专利技术上，目前比亚迪专利申请每年位居第一，刀片电池技术和混动技术更是目前市场最好的。喷子喷外观，比亚迪从唐开始注重工业设计。目前比亚迪的汉与特斯拉比，特斯拉几乎就是一个垃圾车。</blockquote><div class="src">— 个人思考 · 关于比亚迪与自主创新</div></figure><figure class="card"><blockquote>未来可能出现大量类似华为芯片断供、光伏产业被欧洲抵制这类事件，不仅是高科技，也可以是基础问题，比如进口不了粮食水果、出口不了商品，而解决这些问题的办法就是乡村振兴，粮食乡村生产、商品乡村购买，称为国内大循环，抵御随时可能到来的去依附和脱离全球化。如果没本事在该脱离的时候脱离，那么就会回到给美国打白工挣废纸的情形。</blockquote><div class="src">— 个人思考 · 关于国内大循环</div></figure><figure class="card"><blockquote>卡脖子的本质，不是技术差距，是别人不允许你拥有。</blockquote></figure><figure class="card"><blockquote>高端制造这条路，跪着走不通，只能自己趟出来。</blockquote></figure><figure class="card"><blockquote>我们可以买产品，但不能买未来；可以合作，但不能交出命脉。</blockquote></figure></div></section><section class="cat" id="cat-2"><header class="cat-head"><span class="cat-name">经济·内卷时代</span><span class="cat-num">19</span></header><div class="cards"><figure class="card"><blockquote>综合日本的情况，进入无欲望社会与经济增长率有关，如果经济高速增长才不会有所谓“无欲望社会”，而低速增长甚至负增长就会出现。中国年轻人现在并没有真正的“无欲望”，在经济增速放缓的现在，引发了年轻人的焦虑。大部分B站UP主宣扬“放弃奋斗”“低欲望”“内卷”，就是等一些跟风的铁憨憨去信，然后自己偷偷地奋斗，惊艳所有人。每一代人都觉得自己惨，但从总体上看，世界的发展依旧是螺旋式上升的，今天我们依旧有很多机会去创造自己的价值。</blockquote><div class="src">— 个人思考 · 关于无欲望社会</div></figure><figure class="card"><blockquote>年轻人已经不复2015年以前的“荣光”了，上升通道仿佛已经被堵死；以前只需要稍微努力即可获得成功，而现在努力的确仍然有用，只不过其对获得成功的影响力降低了。地区发展的不均衡使得年轻人没得选择，只能和人一起卷。在这个下限还没上去而经济增长又放缓的时代，年轻人“急于求成”的心理更是滋生了焦虑。焦虑只有依靠自己内心，自己去扛。</blockquote><div class="src">— 个人思考 · 关于上升通道</div></figure><figure class="card"><blockquote>巨量的小店在疫情中死亡，行业集中度提高，加速进入到寡头垄断时代，连锁的在尸山上依靠资本优势赚所谓的轻资产模式的管理费。</blockquote><div class="src">— 个人思考</div></figure><figure class="card"><blockquote>深圳没打算让穷人留下，用房价自然筛选掉了穷人落户深圳的可能性。要留下，要么你很厉害，很能挣钱（人才）；要么你本身就很有钱（资本）。看着只是房价高，实际是在剔除穷人留下来的可能性，一本多利。</blockquote><div class="src">— 个人思考 · 关于城市与阶层</div></figure><figure class="card"><blockquote>我们90后这一辈最大的可能是：出身平平，挣个你死我活才考上大学，才争取到一份工作；工作好多年没遇到对的人，钱也没剩多少；时间富余的嫌工资低，工资高的嫌又累又没个人时间；不到30岁就脱发白发、失眠多梦、患得患失。房价炒高了要我们接盘，老龄化要我们生育二胎，彩礼炒高了还不给我们晚婚晚育。好吧，认命咯，佛系一点，欲望降级。</blockquote><div class="src">— 个人思考 · 关于90后处境</div></figure><figure class="card"><blockquote>在这个信息爆炸的时代，所有东西都被量化成了可以度量的价钱。我们迷失了自己，有手机有抖音有游戏有朋友圈，靠这些找存在感。关心旅游照片拍得好不好看、朋友圈有几个赞、今天谁买车明天谁买房。和别人比较真的会让自己有幸福感吗？当离开世界那一天，我们一定后悔把一天的美好都浪费在手机和电子设备上。</blockquote><div class="src">— 个人思考 · 关于消费主义与手机时代</div></figure><figure class="card"><blockquote>年轻人买不起房的原因：以前经济增长、储蓄率增长、房价增长；现在经济增速减慢、储蓄率下降，房价却继续涨，工资涨得过慢。一则寓言——羊月薪5000，想用20万盖个窝，老虎不许，说土地是它的，只准向狼买。狼先花20万贿赂老虎取得开发权，再花50万买地、花10万盖圈，向羊要价200万。羊找狐狸借，连本带息400万、25年还清。老虎、狼、狐狸都赚了，只有羊亏，吓得羊崽子都不敢生。老虎嫌羊肉越来越少，宣布羊要多生小羊，可羊们欠狐狸钱太多，养小羊太难，一直在观望。</blockquote><div class="src">— 个人收藏 · 网络寓言</div></figure><figure class="card"><blockquote>打工还是创业都只是选择而已，贫困的根源是不能脚踏实地的长远规划。几条具体建议：1、十年经验和一年经验相等的工作不值得做，哪怕收入再高；2、不要做兼职，全力做好本职工作；3、不要住得太远，通勤时间绝对不可超过半小时，最好走路10分钟之内；4、把客户的事、老板的事当作自己的事一样对待，当他们开始依赖你，打工还是创业的主动权就在你手上了，做不到这点，创业会比打工死得更惨；5、存钱，一定要存钱，不管收入多少，比例不要低于收入的1/4，你存的每一分钱是你关键时刻逆转命运的绳索，短时间内存得越多机会越大；6、理财，稳定收益的投资，越年轻越可以做稳且低的理财，注意流动性要好，随时能拿出来支持创业。</blockquote><div class="src">— 个人思考 · 关于贫困与规划</div></figure><figure class="card"><blockquote>真正击垮你的不是同行，而是跨界，跨界有时候就像降维打击一样。酒店跨界了电竞，邀上几个朋友去电竞酒店包个宿，比去网吧通宵体验好上太多，价格摊下来也不贵，这对传统酒店和网吧都是打击。现在私人影院跨界了宾馆，确实也挺好，就是再规范一点、登个记啥的其实也没啥。</blockquote><div class="src">— 个人思考 · 关于跨界</div></figure><figure class="card"><blockquote>想学华为的管理方式，得先明白为什么华为可以这么玩：超高的工资待遇、明确的晋升前景、离职后大概率被其他公司高薪争抢。华为的管理方式是建立在这些基础之上的，想要员工跟狼群一样凶残，你得先保证能把他们喂饱。华为引进一整套企业管理模式，很多制度互相制约、环环相扣，结果一堆土老板只挑自己看得懂的拿去用，学了个寂寞。</blockquote><div class="src">— 个人思考 · 关于华为管理</div></figure><figure class="card"><blockquote>房东租出去才交税，你不同意涨价，房东宁愿不租，反正不租又不会亏，过几年卖掉一样赚钱。戳泡沫就要无差别地收房产税，外加高额空置税，耗尽房东和炒房团的现金流。</blockquote><div class="src">— 个人思考 · 关于房价泡沫</div></figure><figure class="card"><blockquote>马克思在《1844年经济学哲学手稿》中提到劳动异化现象：工人在自己的劳动中不是肯定自己，而是否定自己，不是感到幸福，而是感到不幸，不是自由地发挥自己的体力和智力，而是使自己的肉体受折磨，精神遭摧残。工人只有在劳动之外才感到自在，在劳动中则感到不自在。他的劳动不是自愿的劳动，而是被迫的强制劳动。只要肉体的强制或其他强制一停止，人们就会像逃避鼠疫那样逃避劳动。外在的劳动，是一种自我牺牲、自我折磨的劳动。</blockquote><div class="src">— 卡尔·马克思《1844年经济学哲学手稿》</div></figure><figure class="card"><blockquote>因为付出劳动：1，所获得金钱报酬不足以支撑扩大再生产的费用（住房、婚配、子女抚养、老人抚养）；2，付出劳动的同时的外部性——同辈人的看法、父辈的看法、社会地位的差异，造成了心理压力与抗拒；3，所付出劳动的品类不同，可能带来相应关于健康和生命安全的风险（尘肺病、肩周炎等等职业病），所需的医疗费用和对劳动力再生产能力的打击，有时是毁灭性的。</blockquote><div class="src">— 个人思考 · 关于劳动的代价</div></figure><figure class="card"><blockquote>直接生产者与生产资料的剥离：大多数人成为了没有生产资料、而拥有相应生产技能的人，那么拥有生产资料的一方就有了话语权。生产者与产品归属权的割裂：每个生产者只从事一件产品的某一个环节，降低了这种割裂感，同时让生产者与所生产产品之间的关系变得冷漠。根本原因是资本的异化，资本不仅完成了对人的异化，也完成了对社会的异化。相比以前，现在工人待遇是更好了，但现在的工人面对的是被异化的社会。</blockquote><div class="src">— 个人思考 · 关于资本异化与劳动力转型</div></figure><figure class="card"><blockquote>司马南所称的“招工难”，我更愿意称之为“结构性就业调整难”——简单来说，就是我们的劳动力向高质量发展转变正面临着困难。就我目前的感受，我所在的生活范围里工作是不缺人的，但缺的是新型、高端人才。年轻人不愿意到工厂里去，这是对的，向高端化发展是未来制 欢也并不相通，悲喜自渡才是必修课，所以，不言难，不诉苦，种自己的花，结自己的果，远离任何消耗你的人和事。原来真正的成熟，是把情绪调成静音，把生活过成自己喜欢的样子。</blockquote><div class="src">— 网络摘录 · 关于中年与成熟</div></figure><figure class="card"><blockquote>钞票一天比一天少，你会很焦虑。可生命一天比一天少，却一点都不在乎。世界上第一件公平的事，就是所有人都会死。世界上第二件公平的事，就是死后什么都带不走。总盯着兜里还有多少钱，却不算算你能活多少年？万物皆在上涨，唯有岁月在下降。对自己好一点又何妨。如果活着不是为了快乐，那长命百岁又有什么意义？人生也不过才三万来天，来日真的并不方长。凡事想开点，看淡点，简单点，糊涂点，风雨由天，快乐由己……</blockquote><div class="src">— 网络摘录 · 关于生命与快乐（沿途风景随拍）</div></figure><figure class="card"><blockquote>“当年的你意气风发，什么都听不进去，正如现在的你，沉默寡言，什么都说不出口，青丝白发一瞬间，年华老去向谁言，春风若有怜花意，可否许我再少年，少时自负凌云笔，到而今，回首向来萧瑟处，归去，也无风雨也无晴。”</blockquote><div class="src">— 网络摘录 · 化用苏轼《定风波》“也无风雨也无晴”</div></figure><figure class="card"><blockquote>人生其实非常短暂，不是每个人都能活到八九十岁，即便长寿，也要忍受衰弱和病痛。精力旺盛的好年头可能也就二三十年，所以千万别被旁人的眼光或社会的标准框住，想吃什么就吃，想学什么就学，多陪陪惦念的人，多看看世界，享受生活本身，因为人生是仅此一次的体验。</blockquote><div class="src">— 网络摘录 · 关于人生短暂与体验</div></figure></div></section><section class="cat" id="cat-4"><header class="cat-head"><span class="cat-name">认知·读书与思维</span><span class="cat-num">15</span></header><div class="cards"><figure class="card"><blockquote>不是读书读得越多越呆头呆脑，他们是在学校被限制了阅读范围，学校禁止带课外书。他们很多的知识都被禁锢在小小的教科书范围，变成了只会考试的机器。如果是那种阅览群书的大学生，知识储备跟社会经验都是一般人比得上的，读过有关商业、历史、教育、心理、人际交往等等的书，阅历就远超普通人了。</blockquote><div class="src">— 个人思考 · 关于读书</div></figure><figure class="card"><blockquote>智商税基本上属于人类税，只要你是人类基本上都避免不了，无非就是你获得的价值和被割的价钱到底有多对等而已，反正也是两厢情愿的事情。</blockquote><div class="src">— 个人思考</div></figure><figure class="card"><blockquote>现代人看问题碎片化、片面化，只停留在热门的角度，不会去深刻地发现问题。什么事情都是焦虑，你去推动了，问题解决了，焦虑自然而然也就没了，而不是动不动就谈焦虑。</blockquote><div class="src">— 个人思考 · 关于焦虑</div></figure><figure class="card"><blockquote>35岁职业危机的来源确实不单单是职业上的，更多的还是心理上、家庭上。比那些单纯贩卖毒鸡汤的视频好太多，它确实开启了我对职业危机的思考：木桶理论的荒谬性。那个时候我年少气盛听不进去。</blockquote><div class="src">— 个人思考 · 关于职业危机</div></figure><figure class="card"><blockquote>任何一个个体，一旦在某一方面取得成功或者进步，就会产生一种累积优势，就会有更大的机会取得更大的成功。</blockquote><div class="src">— 个人思考 · 关于累积优势（马太效应）</div></figure><figure class="card"><blockquote>内卷是社会发展的必然规律，走出内卷要有自己的应对。资本家还发明出一种叫做工作崇拜的东西——工作就是你的人生义 6.信息隔绝</blockquote></figure></div></section><section class="cat" id="cat-5"><header class="cat-head"><span class="cat-name">历史·人物金句</span><span class="cat-num">7</span></header><div class="cards"><figure class="card"><blockquote>吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</blockquote><div class="src">— 孔子 · 《论语·为政》</div></figure><figure class="card"><blockquote>我们走后，他们会给你们修学校和医院，会提高你们的工资，这不是因为他们良心发现，也不是因为他们变成了好人，而是因为我们来过。</blockquote><div class="src">— 切·格瓦拉</div></figure><figure class="card"><blockquote>帝国主义怎么总是垂而不死，腐而不朽呢，那是因为他们靠长时间剥削第三方世界国家，而转移了他们自己国家资产阶级和无产阶级的矛盾，甚至一度绑架了他们国内的无产阶级，一起去剥削第三方世界国家。哪里有压迫哪里就有斗争。而无产阶级要获得自身的解放，首先必须解放全人类。</blockquote><div class="src">— 艾跃进</div></figure><figure class="card"><blockquote>面对我们的骨灰，高尚的人将洒下热泪。</blockquote><div class="src">— 马克思</div></figure><figure class="card"><blockquote>为天地立心，为生民立命，为往圣继绝学，为万世开太平。</blockquote><div class="src">— 张载</div></figure><figure class="card"><blockquote>为中华之崛起而读书。</blockquote><div class="src">— 周恩来</div></figure><figure class="card"><blockquote>可怜身上衣正单，心忧炭贱愿天寒。</blockquote><div class="src">— 白居易</div></figure></div></section><section class="cat" id="cat-6"><header class="cat-head"><span class="cat-name">社会·世相观察</span><span class="cat-num">9</span></header><div class="cards"><figure class="card"><blockquote>潮汕人确实不爱打工，至少我的父辈没人在打工，都是自己开店开厂，潮汕人排外也是真的，舍得花钱也是真的，初一十五就要拜老爷，还要拜将军庙等等，所以吃的消费是真的高，喜欢拉帮结派也是真的。潮商会回来建学校也是真的。</blockquote><div class="src">— 个人观察 · 潮汕</div></figure><figure class="card"><blockquote>作为平头老百姓，乐于看到正义被伸张。但司法系统里，说实在的，比比皆是。你知道有些知名律师最喜欢说什么吗，司法系统里我有关系，这一句话案子有了，费用高了，而当事人往往就希望你有关系，不管真假，这一句话钱就舍得掏。</blockquote><div class="src">— 个人观察 · 关于司法</div></figure><figure class="card"><blockquote>先得巧立名目，拉拢豪绅，纳税交钱，他们交了，才能让百姓跟着交。得钱之后，豪绅的钱如数奉还，百姓的钱三七分成，这钱不就有了吗。</blockquote><div class="src">— 《让子弹飞》台词</div></figure><figure class="card"><blockquote>老人本身，健康的老人，吃喝拉撒睡不需要人服侍的老人，在哪里都一样，在养老院也是如此！不管你有没有子女，行动自如的老人都是可以活得很有质量的！但相反，如果老人不健康了，吃喝拉撒睡都要人伺候了，那么对不起，时间长了就连自己的孩子都不可能尽心尽责。</blockquote><div class="src">— 个人观察 · 关于养老</div></figure><figure class="card"><blockquote>多年后的我60岁的那天早晨5点，我起床，去公园晨练，回来后煮了早餐，送完孙子上学，刚好8点。来到地铁站，人很多，一小伙子要给我让座，我看了看孱弱的他，说：不用不用，咱们都是上班族。来到公司，那条刺眼的规定总是让我不适：所有拐杖必须整齐停放在公司门口，违者罚款200元。另一条是茶水间的温馨提示：同事们请把各自的药瓶药罐贴上标签以免别人吃错了。这个上午，老板又收到了三份辞职信，辞职理由是：与世长辞。其中一份是和我斗气几十年的同事递交的，点开QQ，他的签名是：感谢国家，实现了长生不老，我这辈子就没等到养老的那一天。写完这条签名，他的头像就再也没有亮起。中午没有食欲，因为昨天把假牙弄丢了。接着我发现HR在休闲区贴了温馨提示：请大家饭后保管好自己的假牙，我们的下水道再也堵不起了。下午部门开会，我发现主管的记忆退了许多，说完第8点后，突然一句：好，以上是第1点，现在来说第2点。直到下班，我们还是在说第2点。主管怪责我为什么没有提醒他，其实我一共提醒了他13次。不跟他计较，明年他65岁，就退休了。我继续“埋头”苦干，这时想起63岁的老王，给他发短信：三天没来晨运了，这次又是什么病？老王回复：跑业务，扭到腰了。今天你60大寿，过得怎样？我说：挺好的，晚上公司没什么人，网速也够快，我还偷偷连续发了好多条微博谈60岁人生感悟，加班就是好！夜晚11点回到家，菜凉了，孩子们都睡觉了。我躺在冰凉的床上，打开工资条，看着扣除养老保险那一栏，转脸朝着老伴躺的那一边，对着空气说：你等不到的，我尽量替你等到。若干年后，中国会出现一个奇观：年轻人无法就业，每天逛公园；老年人没法退休，每天上班。于是每天早晨的时候，老太婆就喊了：孙子，你上午去公园遛鸟之前，先扶你爷爷去单位上班！</blockquote><div class="src">— 个人创作 · 关于老去与延迟退休</div></figure><figure class="card"><blockquote>人性的底色，一半是趋利避害，一半是共情善良。</blockquote></figure><figure class="card"><blockquote>众人追求体面的时候，体面本身就成了枷锁。</blockquote></figure><figure class="card"><blockquote>距离产生尊重，边界带来长久。</blockquote></figure><figure class="card"><blockquote>为众人抱薪者，不可使其冻毙于荒野。</blockquote><div class="src">— 网络流传 · 常见版本作“冻毙于风雪”；附记：他遭受过苦难，用善举为了不让这些困难在别的家庭再发生一遍，请当地的朋友保护好他</div></figure></div></section><section class="cat" id="cat-7"><header class="cat-head"><span class="cat-name">工作·经营与团队</span><span class="cat-num">8</span></header><div class="cards"><figure class="card"><blockquote>常有人说“公司不完美，我为什么要拼命？”但请想想：我们能接受自己的笨拙，为什么不能接受公司的成长？我们能容忍自己的拖延，为什么不能给公司改变的时间？公司不是冰冷的机器，而是你我他的共生体，你怎么样他就怎么样。有人拿3000的工资也不会嫌少，拿3000的工资就偷2500的懒，记住不是你赚了，你浪费的是自己的青春和年华。别听那么多毒鸡汤：努力不一定成功，但不努力一定很轻松。事业和家庭，如果没有大家的努力和付出、笃定和坚守，你会看到一地鸡毛。出来混是要还的，因果循环，有些伤害注定导致反噬，你我都一样，没有谁能够逃脱。</blockquote><div class="src">— 个人思考 · 关于公司与员工</div></figure><figure class="card"><blockquote>房地产一代辉煌，到现在的夕阳西下。爆雷企业有多少，裁员的有多少，减薪的有多少，连政府单位都发不起工资。公司多年以来，再困难也在想办法解决工资支付，但如此行情之下，你的公司何以立身？有什么特别的竞争优势吗？如果都说不出来，那倒霉的为什么就不是自己呢？好的时候觉得理所当然、是我应该得到的，不好的时候就想着为什么是我。人贵有自知之明，我越来越发现自己的肤浅，所有的功劳都不属于我，是平台深耕多年商业积累、是平台给予我的学习机会、是领导充分的认可、是团队的默默付出。别想我们多牛逼，夜郎自大是怎么来的，无知才无畏。</blockquote><div class="src">— 个人思考 · 关于公司与自知</div></figure><figure class="card"><blockquote>大家可以看一下全中国的公司，有多少公司仅仅是利益的共同体，大难临头各自飞，有多少公司是以员工物质和精神的双幸福为企业使命并且切实落地的。我们学习稻盛和夫也有几年了，这是工作和人生获得幸福的修炼之法。不管公司推行任何一种统一文化，不管是华为的还是谁的，很多人都会认为这是在PUA、职业崇拜，让我多做事少拿钱。人的偏见真的很可怕，一开始的否定，就注定满了的杯子装不下任何东西。学习之后我发现，这不是什么福利，艰苦奋斗你要走在最前面，冲锋陷阵你要走在最前面，身先士卒你要走在最前面。虽然表面看大家觉得我们很累，实际我们的内心是快乐的，走的每一步都很踏实，经过自己一点一滴的耕耘、流的血、滴的汗，收成的米饭才香。</blockquote><div class="src">— 个人思考 · 关于稻盛哲学与偏见</div></figure><figure class="card"><blockquote>《面对危机的大智慧》这本书给了我们很大的启发。任何一个国家包括日本，都是在磨难中成长，日本每10年经历一次大的危机，稻盛和夫经营的企业还能坚持下来、还能盈利、还能保持高收益。我们改革开放几十年，七十年的经济成就就赶上了别人两百年的经济成就，地产经济是经济转型中避免不了的，所以这也是给予我们的一次很大考验。稻盛和夫面对危机时觉得这是修炼内功的机会，他不断自省，极致地做销售最大化、费用最小化、效率最大化，才有了这几个宇宙大公司。我们个人呢，有没有认真地去自省和复盘？企业也好个人也好，我们不用跑赢老虎和狮子，也不需要跑赢别人，在行业内或专业上找到参照，跑赢自己的内心就好。今天的努力就能看清楚明天，明天的努力就能看清楚后天。</blockquote><div class="src">— 个人思考 · 关于危机与内功</div></figure><figure class="card"><blockquote>很多人没有切身感受，公司的点点滴滴与我何干。有诉讼的、有工人闹薪，那都是领导和别人处理的事情，不关我的事；我只管好投标，中标与否无所谓；合同签了履约我不管；商务条款和法务条款的风险是别人管的；联营老板盈亏自负，用材用量价格超了也不关我商务什么事；项目要资料我就给盖章。还记得那个历史故事：起初他们追杀共产主义者，我没有说话，因为我不是共产主义者；接着他们追杀犹太人，我没有说话，因为我不是犹太人；最后他们奔我而来，却再也没有人站起来为我说话了。雪崩的时候，没有哪一片雪花是无辜的。公司是大家的公司，还在以旁观者的角色看待，还笑得出来的时候，那不是笑别人，而是笑自己。</blockquote><div class="src">— 个人思考 · 关于旁观与共同体</div></figure><figure class="card"><blockquote>我们每天的工作氛围很活跃，看得出来我们很热爱生活，希望把这种热情也用在工作上、事业上。我觉得每个人都是我的老师，尽管专业出身、一建和中级工程师、也在行业不少年份，越学习越发现自己的无知和渺小。人无完人，客户成交的可能不是因为我们的专业，而是因为我们的热情和用心的服务。不要妄自菲薄，专业出身与否、能力大小与否、履历经验多少，在你的热情之下都是可以慢慢变好的，问题是你能否现在就改变并且持之以恒。稻盛和夫的人生和工作的结果＝思维方式×热情×能力，正确的思维方式为正，不正确的为负，要善护念自己的正确思维方式。一个月看不出什么，三个月可能就看得出来，一年一定会有量变到质变。</blockquote><div class="src">— 个人思考 · 关于热情与思维方式</div></figure><figure class="card"><blockquote>对于加班，我们说尽量不要把加班常态化，大家需要生活和学习充电，是希望大家提高效率和计划性，效率和计划性达不到，该加班就是要加班，不是以工作的饱和度去衡量要不要加班。作为人何为正确？要做正确的事情，而且把正确的事情贯彻下去。不要以自己的能力范围去定义我们可以做多大的事情，既然定了这个目标，就以这个目标为导向，该提高专业水平就提高专业水平，该提高理论水平就提高理论水平，该考证就考证。正确不是我们想怎么做就怎么做，而是我们应该怎么做就笃定地这么做。</blockquote><div class="src">— 个人思考 · 关于加班与正确</div></figure><figure class="card"><blockquote>敬天爱人，是稻盛老先生的思想精髓，员工的笑容和客户的笑容是企业最好的风水。作为企业的领导者，对员工自上而下的关怀，能够唤醒员工对客户的服务意识，把更多的爱投射到客户身上，也让员工在工作中找到成就感、不断提升，从而收获幸福。最后引用雷军的一句话：“如果你想干一件事就先去干，哪怕做得再烂、哪怕一点都不完美，一个粗糙的开始就是最好的开始。别等自己准备得万无一失才行动，因为根本没有完美的准备，只有在行动中不断调整和进化。真正的成长都是在问题中摸索出来的，潜力也是在实践中被激发的。时间从不会等你，每一天都是你最年轻的一天，错过了当下就是错过了最好的机会。不管结果如何，踏出第一步和原地踏步，你选哪一个？”</blockquote><div class="src">— 个人思考 · 关于敬天爱人</div></figure></div></section><section class="cat" id="cat-8"><header class="cat-head"><span class="cat-name">搞笑玩梗</span><span class="cat-num">18</span></header><div class="cards"><figure class="card"><blockquote>有些东西不能不信，很邪的，我们隔壁村有个人发现自己腿上全部变成乌黑乌黑的青紫色，然后赶紧去医院各种检查，X光都做了都看不出是什么病，最后请了一个当地很有名气的大仙，才知道原来是秋裤掉色。</blockquote></figure><figure class="card"><blockquote>有些东西不能不信，我记得小时候有股神秘的力量勒住我脖子，勒住我踹不过气来去了好几家医院都找不出原因，后来找到我们村东头的张大仙才知道我毛衣穿反了。</blockquote></figure><figure class="card"><blockquote>听着听着，我默默的点燃一根烟。我抽一半，风抽一半。我想风应该也有它的烦恼吧。可风有烦恼为什么抽我的烟呢？于是我开始抽风。</blockquote></figure><figure class="card"><blockquote>告诉大家一个年入百万的方法，而且保证不犯法，还很简单。往银行里存6000万，一年利息就差不多100万。</blockquote></figure><figure class="card"><blockquote>有一次跟一个广西朋友吃饭，他夹了一个田螺一吸，就说是公的，又夹了一个一吸又说是公的，我就想怎么这么厉害。后来才知道是空的。</blockquote></figure><figure class="card"><blockquote>今天上厕所的时候拉的特别稀，我现在才明白是为什么，原来我把想你流下来的眼泪都忍住咽回了肚子里，窜稀了</blockquote></figure><figure class="card"><blockquote>今天有点冷，本来以为街上没人，结果刚刚偷电瓶的时候被抓了，本来想反抗，结果警察说了一句老实点别动，我立刻就放弃了抵抗，因为我记得你说过你喜欢老实人。</blockquote></figure><figure class="card"><blockquote>我让你模仿的去做，没让你超越呀</blockquote></figure><figure class="card"><blockquote>你这么优秀，我压力很大呀。</blockquote></figure><figure class="card"><blockquote>你长得这么好看就算了，怎么做事都这么招人喜欢呢</blockquote></figure><figure class="card"><blockquote>身高不够高：被颜值压的</blockquote></figure><figure class="card"><blockquote>树无皮必枯无疑，人无皮天下无敌。</blockquote></figure><figure class="card"><blockquote>感觉这个社会越来越好了。男生都挺懂事，一有钱就想多照顾几个女生。女生也很懂事，知道男生没钱就不和他在一起，免得他辛苦。世界充满了爱。</blockquote></figure><figure class="card"><blockquote>今天被包工头骂了，说我拌的水泥太稀了，包工头把我的铁锹锤烂了，问我水是不是不要钱。我不敢反驳，他不知道的是我没有多放水，只是拌水泥时很想你，眼泪掉进了水泥里</blockquote></figure><figure class="card"><blockquote>今天被老婆骂了，说我剁的鸡脚太烂了，老婆把我的刀甩到了一边，问我是不是有力气没地方使。我不敢反驳，她不知道的是我没有乱使力气，只是剁鸡脚的时候想到了我老板，力气就使大了</blockquote></figure><figure class="card"><blockquote>让我想起了卖核弹的女孩，女孩下雪天卖核弹，结果人们都忙着圣诞，没有人买她的核弹。在饥寒交迫，想起慈祥的祖母，冷的不行了，她打开了一颗，那一晚全镇人都见到了她的祖母——《安屠村童话》</blockquote></figure><figure class="card"><blockquote>听完这曲我睡不着了，爬起来走到窗前抽支烟，发现一只蟑螂，于是跟它聊了很久，把对生活的不爽，工作的压力，发泄给它听，抽完烟，一拖鞋狠狠拍死，没办法，它知道的太多了</blockquote></figure><figure class="card"><blockquote>儿孙自有儿孙福，没有儿孙我享福</blockquote></figure></div></section>

<script>
  // 搜索过滤
  var q = document.getElementById('q');

    cards.forEach(function(c){
      var t = c.textContent.toLowerCase();

    secs.forEach(function(s){
      var vis = s.querySelectorAll('.card:not(.hidden)').length;
      s.classList.toggle('hidden', v && vis === 0);

  });
  // 分类导航点击
  var items = document.querySelectorAll('.nav-item');
  items.forEach(function(it){
    it.addEventListener('click', function(){
      var id = it.getAttribute('data-target');
      var el = document.getElementById(id);
      if(el) window.scrollTo({top: el.offsetTop - 110, behavior:'smooth'});
    });
  });
  // 滚动高亮
  var wrap = document.getElementById('wrap');
  window.addEventListener('scroll', function(){
    var pos = window.scrollY + 120;
    var cur = 0;
    document.querySelectorAll('.cat').forEach(function(s,i){
      if(s.offsetTop <= pos) cur = i;
    });
    items.forEach(function(it,i){ it.classList.toggle('active', i===cur); });
  });
</script>
